# Configuración de Supabase en local (CLI). No contiene claves ni contraseñas.
# Los proyectos reales (pruebas y real, en Irlanda eu-west-1) se configuran en el panel de Supabase.
project_id = "fitnessindramas"

[api]
enabled = true
port = 54321
# Solo se exponen estos esquemas; `privado` nunca
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
# Registro cerrado: las cuentas solo se crean desde la función de alta
enable_signup = false
jwt_expiry = 3600
# Igual que en los proyectos reales (decisión de Domingo, 5/11/2026): 6 caracteres o más, sin más reglas
minimum_password_length = 6
password_requirements = ""
enable_refresh_token_rotation = true

# Ojo: no poner [auth.email] enable_signup = false: desactiva el inicio de sesión con correo.
# El registro ya queda cerrado con [auth] enable_signup = false.

# Funciones del servidor. alta-cliente exige sesión (lo comprueba Supabase y la propia función).
# canjear-codigo se llama sin sesión (está limitada por intentos) y limpieza-diaria
# comprueba ella misma su llave propia (LIMPIEZA_TOKEN).
[functions.canjear-codigo]
verify_jwt = false

[functions.limpieza-diaria]
verify_jwt = false

# Pasa todas las pruebas del servidor en cada cambio. Si alguna falla, el cambio queda
# en rojo y la protección de la rama principal impide unirlo y publicarlo.
name: Pruebas de la base de datos

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pruebas-bd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  permisos:
    name: Permisos y políticas RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        with:
          version: 2.122.0

      - name: Arrancar la base de datos local con las migraciones
        run: supabase db start

      - name: Pruebas pgTAP
        run: supabase test db

  app:
    name: Construir la app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Dependencias exactas (las del package-lock.json, sin scripts)
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            echo "Falta package-lock.json en el repositorio. Generado (base64) entre las marcas:"
            echo "=== INICIO LOCK ==="; base64 -w0 package-lock.json; echo; echo "=== FIN LOCK ==="
            exit 1
          fi
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Firmas de los paquetes descargados
        run: npm audit signatures

      - name: Construir backend.js
        run: npm run construir

      - name: Ninguna clave secreta dentro de la app
        run: |
          if grep -rIl --exclude-dir=node_modules --exclude-dir=.git -E 'sb_secret_[A-Za-z0-9_-]{10,}' . ; then
            echo "::error::Hay una clave secreta de Supabase en los archivos de la app"; exit 1
          fi
          echo "backend.js: $(wc -c < backend.js) bytes"

  funciones:
    name: Funciones del servidor
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        with:
          version: 2.122.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Pruebas del código común (sin Supabase)
        run: deno test --allow-env pruebas/comun_test.ts

      - name: Arrancar Supabase local
        run: supabase start -x studio,imgproxy

      - name: Secretos de prueba (aleatorios en cada ejecución)
        run: |
          umask 077
          printf 'CODIGO_PEPPER=%s\nLIMPIEZA_TOKEN=%s\nORIGENES_PERMITIDOS=https://app.fitnessindramas.com\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > supabase/functions/.env

      - name: Servir las funciones
        run: |
          nohup supabase functions serve --env-file supabase/functions/.env > funciones.log 2>&1 &
          for i in $(seq 1 90); do
            estado=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/limpieza-diaria || true)
            if [ "$estado" = "401" ]; then echo "Funciones listas"; exit 0; fi
            sleep 2
          done
          echo "Las funciones no arrancaron (último estado: $estado)"; tail -n 50 funciones.log; exit 1

      - name: Pruebas de las funciones
        run: |
          eval "$(supabase status -o env)"
          LIMPIEZA_TOKEN=$(grep '^LIMPIEZA_TOKEN=' supabase/functions/.env | cut -d= -f2)
          export API_URL ANON_KEY SERVICE_ROLE_KEY LIMPIEZA_TOKEN
          deno test --allow-net --allow-env pruebas/funciones_test.ts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: 22

      - name: Pruebas del acceso de profesionales (backend/ de la app)
        if: hashFiles('package-lock.json') != ''
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node --test pruebas/backend_test.mjs

      - name: Registro de las funciones (solo si algo falla)
        if: failure()
        run: tail -n 100 funciones.log || true
